/* Centered glass card — no blur on bg, only a soft card surface */
.container {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px;
}

.card {
    background: rgba(243, 241, 231, 0.82);
    border: 1px solid rgba(180,170,150,0.45);
    border-radius: 20px;
    padding: 28px 44px 44px;
    max-width: 480px;
    width: 100%;
    text-align: center;
    box-shadow: 0 8px 40px rgba(80,70,50,0.12), 0 2px 8px rgba(80,70,50,0.08);
    /* No backdrop-filter so the background stays sharp */
}

/* Logo mark */
.brand-logo {
    width: 380px;
    height: auto;
    margin: -30px auto -40px;
    display: block;
    mix-blend-mode: multiply;
}

.tagline {
    color: #666;
    font-size: 16px;
    font-weight: 300;
    line-height: 1.6;
    margin-bottom: 24px;
     margin-top: 8px;
}

/* Pill badges */
.badges {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 32px;
}
.badge {
    background: rgba(255,255,255,0.7);
    border: 1px solid rgba(150,140,120,0.4);
    border-radius: 50px;
    padding: 4px 12px;
    font-size: 12px;
    color: #555;
    letter-spacing: 0.2px;
}

/* Email input */
.input-wrap {
    display: flex;
    align-items: center;
    background: rgba(255,255,255,0.75);
    border: 1.5px solid rgba(140,130,110,0.5);
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 20px;
    transition: border-color 0.2s;
}
.input-wrap:focus-within {
    border-color: #555;
    background: rgba(255,255,255,0.92);
}
.input-wrap span { font-size: 16px; margin-right: 10px; }
.input-wrap input {
    border: none;
    outline: none;
    background: transparent;
    width: 325px;
    font-size: 14px;
    font-family: "DM Sans", sans-serif;
    color: #222;
}
.input-wrap input::placeholder { color: #999; }

.sync-btn {
    width: 130px;
    height: 130px;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    background: transparent;
    border: none;
    padding: 0;
    margin: 0 auto 12px;
    overflow: hidden;
    border-radius: 50%;
}

.sync-img {
    width: 130px;
    height: 130px;
    object-fit: cover;
    border-radius: 50%;
    display: block;
    transition: transform 0.5s ease;
}

.sync-btn:hover .sync-img {
    transform: rotate(180deg);
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    
}

@keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
}

.cta-label {
    font-size: 13px;
    color: #777;
    margin-top: 4px;
}

/* Divider */
.divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 24px 0;
    color: #bbb;
    font-size: 12px;
}
.divider::before, .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: rgba(150,140,120,0.35);
}

/* Footer note */
.footer-note {
    font-size: 11px;
    color: #aaa;
    line-height: 1.5;
}

@media (max-width: 500px) {
    .card { padding: 36px 24px 32px; }
    .sync-btn { width: 90px; height: 90px; }
    .sync-icon { font-size: 26px; }
}
</style>
</head>
<body>
<div class="container">
    <div class="card">
        <img src="WorkSync_logo.png" alt="WorkSync" class="brand-logo">
        <p class="tagline">Inbox To Intelligence.<br>Automate your workflow.</p>

        <div class="badges">
            <span class="badge">📋 To-Do Lists</span>
            <span class="badge">📊 Dashboard</span>
            <span class="badge">⚙️ Automation</span>
        </div>

        <div class="input-wrap">
            <span>📩</span>
            <form id="loginForm">
                <input 
                    type="email" 
                    id="email"
                    placeholder="Enter your email"
                    required
                >
            </form>
        </div>

        <div class="sync-btn"  id="syncBtn" onclick="goToDashboard()">
            <img src="sync.png" alt="Sync" class="sync-img">
        </div>
        <div class="cta-label">Connect your inbox to get started</div>

        <div class="divider">or</div>
        <div class="footer-note">By continuing, you agree to our Terms of Service.<br>No spam. Unsubscribe anytime.</div>
    </div>
</div>

<script>
document.getElementById("syncBtn")
.addEventListener("click", async function() {

    const email =
      document.getElementById("email")
      .value
      .trim();

    if (!email) {

        alert("Please enter your email");
        return;
    }

    // Save login state
    localStorage.setItem(
      "loggedIn",
      "true"
    );

    localStorage.setItem(
      "userEmail",
      email
    );

    // Sync animation
    const syncBtn =
      document.getElementById("syncBtn");

    syncBtn.style.opacity = "0.7";
    syncBtn.style.pointerEvents = "none";

    // Small sync delay
    setTimeout(() => {

        window.location.href =
          "main.html";

    }, 1200);

});
</script>
</body>
</html>
